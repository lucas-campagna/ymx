[package]
name = "ymx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ymx"
path = "src/main.rs"

[dependencies]
indexmap.workspace = true
ymx-lib.workspace = true
ymx-config.workspace = true
ymx-test.workspace = true
serde_json.workspace = true
yaml-rust2.workspace = true

[features]
default = ["pdf-system"]
pdf-system  = ["ymx-lib/pdf-system"]
pdf-bundled = ["ymx-lib/pdf-bundled"]
pdf-docker  = []

# Man page: view with `man ./man/ymx.1` or copy to your manpages directory.
# The man page source is at man/ymx.1 in this crate's source directory.
[package.metadata]
man = "man/ymx.1"