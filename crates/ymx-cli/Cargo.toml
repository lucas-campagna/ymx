[package]
name = "ymx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ymx"
path = "src/main.rs"

[dependencies]
urlencoding = "2"
indexmap.workspace = true
ymx-lib.workspace = true
ymx-config.workspace = true
ymx-test.workspace = true
ymx-lint = { path = "../ymx-lint" }
serde_json.workspace = true
yaml-rust2.workspace = true
notify = { version = "6", optional = true }
ctrlc = { version = "3", optional = true }
cfg-if = "1"
ignore.workspace = true
ironpress = { version = "1.7" }

[package.metadata]
man = ["man/ymx.1"]

[features]
default = ["watch", "http"]
http = ["ymx-lib/http"]
watch = ["notify", "ctrlc"]
