[package]
name = "ymx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ymx"
path = "src/main.rs"

[dependencies]
headless_chrome = { version = "1.0", optional = true }
urlencoding = "2"
indexmap.workspace = true
ymx-lib.workspace = true
ymx-config.workspace = true
ymx-test.workspace = true
serde_json.workspace = true
yaml-rust2.workspace = true
notify = "6"

[features]
pdf-system  = ["headless_chrome"]
pdf-bundled = ["headless_chrome/fetch"]
default = []

# Man page: view with `man ./man/ymx.1` or copy to your manpages directory.
[package.metadata]
man = "man/ymx.1"
