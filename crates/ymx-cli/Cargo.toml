[package]
name = "ymx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ymx"
path = "src/main.rs"

[dependencies]
indexmap.workspace = true
ymx-lib.workspace = true
ymx-config.workspace = true
ymx-test.workspace = true
serde_json.workspace = true
yaml-rust2.workspace = true

[features]
# Docker backend is always compiled in (std::process::Command, no extra deps)
# Chrome backends are opt-in:
pdf-system  = ["ymx-lib/pdf-system"]
pdf-bundled = ["ymx-lib/pdf-bundled"]

# Man page: view with `man ./man/ymx.1` or copy to your manpages directory.
[package.metadata]
man = "man/ymx.1"
