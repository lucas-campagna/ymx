[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[workspace.dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
yaml-rust2 = "0.11"
ryu = "1"

ymx-core = { path = "crates/ymx-core" }
ymx-config = { path = "crates/ymx-config" }
ymx-test = { path = "crates/ymx-test" }
ymx-lib = { path = "crates/ymx-lib" }