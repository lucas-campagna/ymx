main:
  html:
    - "<head>": $head()
    - "<body>": $body()

head:
  <style>: |
    @page {
      margin: 0;
      @top-center {
        content: element(header);
        width: 100%;
      }
    }

    header {
      position: running(header);
      width: 100%;
      background: red;
      display: flex;
      justify-content: center;
    }

