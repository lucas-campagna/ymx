name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (JSON)
        run: cargo clippy --workspace --all-targets --message-format=json -- -D warnings > clippy.json

      - name: Upload clippy-json artifact
        uses: actions/upload-artifact@v4
        with:
          name: clippy-json
          path: clippy.json

      - name: cargo test (JSON)
        run: cargo test --workspace --message-format=json > test.json

      - name: Upload test-json artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-json
          path: test.json

      - name: cargo build --timings
        run: cargo build --workspace --timings

      - name: Upload cargo-timings artifact
        uses: actions/upload-artifact@v4
        with:
          name: timings
          path: target/cargo-timings.html

  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["pdf-system", "pdf-bundled", "pdf-docker"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace --features ${{ matrix.features }}
        run: cargo test --workspace --features ${{ matrix.features }}
      - name: cargo build --workspace --features ${{ matrix.features }}
        run: cargo build --workspace --features ${{ matrix.features }}
