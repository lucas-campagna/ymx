name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd crates/ymx-web
          wasm-pack build --target web --out-dir ../../web/pkg --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install ironpress
        run: |
          cd web
          npm ci

      - name: Copy ironpress to vendor
        run: |
          mkdir -p web/vendor
          cp web/node_modules/ironpress/ironpress.js web/vendor/
          cp web/node_modules/ironpress/ironpress_bg.wasm web/vendor/

      - name: Copy web assets
        run: |
          mkdir -p _site
          cp -r web/* _site/
          # Remove node_modules and package files from deployment
          rm -rf _site/node_modules _site/package.json _site/package-lock.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4