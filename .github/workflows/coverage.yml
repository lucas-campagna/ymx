name: Coverage

on: [push, pull_request]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update stable toolchain
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate lcov coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

      # ---------------------------------------------------------------------
      # Codecov upload path (commented-in form).
      # ---------------------------------------------------------------------
      # The two steps below upload coverage to Codecov. They require a remote
      # (e.g. GitHub) and a `CODECOV_TOKEN` repository secret to be configured
      # before they can run. Uncomment these steps once a remote + token exist
      # so coverage uploads to Codecov and the badge in `docs/impl/README.md`
      # can render. Left commented while the repo has no remote; the lcov
      # artifact path above is the token-free fallback.
      # ---------------------------------------------------------------------
      # - name: Generate codecov coverage report
      #   run: cargo llvm-cov --workspace --codecov --output-path codecov.json
      #
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v5
      #   with:
      #     files: codecov.json
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     fail_ci_if_error: true