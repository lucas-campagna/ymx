<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>YMX Playground</title>
    <link rel="stylesheet" href="style.css?v=20241119h">
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs/editor/editor.main.css">
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs/loader.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs' }});
        require(['vs/editor/editor.main'], function(monaco) {
            window.monaco = monaco;
            window.monacoLoaded = true;
        });
    </script>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="icon-btn sidebar-toggle" id="sidebar-toggle" title="Toggle Explorer" aria-label="Toggle Explorer">☰</button>
            <h1 class="logo">YMX Playground</h1>
        </div>
        <div class="header-center">
        </div>
        <div class="header-right">
            <div class="status" id="status">Ready</div>
            <button class="btn btn-primary" id="download-btn" title="Download current view">Download</button>
            <button class="icon-btn preview-toggle" id="preview-toggle" title="Toggle Preview" aria-label="Toggle Preview">👁</button>
        </div>
    </header>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="preview-overlay" id="preview-overlay"></div>

    <div class="main-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Explorer</h2>
                <div class="sidebar-actions">
                    <button class="icon-btn" id="new-file-btn" title="New File">+</button>
                    <button class="icon-btn" id="new-folder-btn" title="New Folder">📁</button>
                </div>
            </div>
            <div class="file-tree" id="file-tree"></div>
        </aside>

        <div class="editor-container">
            <div class="editor-header">
                <div class="tabs" id="tabs" role="tablist"></div>
                <div class="editor-actions">
                    <span class="file-info" id="file-info">No file selected</span>
                </div>
            </div>
            <div class="editor-wrapper">
                <div id="editor" class="editor"></div>
            </div>
            <div class="lint-container" id="lint-container">
                <div class="lint-header">
                    <h3>Lint Issues</h3>
                    <button class="btn btn-secondary btn-sm" id="lint-close-panel" title="Close">✕</button>
                </div>
                <div class="lint-content" id="lint-content"></div>
            </div>
        </div>

        <div class="resize-handle resize-handle-vertical" id="resize-handle-vertical" aria-label="Resize preview panel vertically" role="slider" aria-orientation="vertical" tabindex="0"></div>

        <div class="resize-handle resize-handle-horizontal" id="resize-handle-horizontal" aria-label="Resize preview panel horizontally" role="slider" aria-orientation="horizontal" tabindex="0"></div>

        <div class="preview-container" id="preview-container">
            <div class="preview-header">
                <h2>Preview</h2>
                <div class="preview-actions">
                    <div class="view-selector" role="tablist" aria-label="Output format">
                        <button class="view-btn active" role="tab" data-view="html" aria-selected="true">HTML</button>
                        <button class="view-btn" role="tab" data-view="json" aria-selected="false">JSON</button>
                        <button class="view-btn" role="tab" data-view="page" aria-selected="false">PAGE</button>
                        <button class="view-btn" role="tab" data-view="pdf" aria-selected="false">PDF</button>
                    </div>
                </div>
            </div>
            <div class="preview-content" id="preview-content">
                <div class="preview-placeholder">
                    <p>Select a file and start editing to see the preview</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <h3 id="modal-title">New File</h3>
            <form id="modal-form">
                <div class="form-group">
                    <label for="modal-input">Name</label>
                    <input type="text" id="modal-input" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="lint-modal" role="dialog" aria-modal="true" aria-labelledby="lint-modal-title">
        <div class="modal-content modal-large">
            <div class="lint-modal-header">
                <h3 id="lint-modal-title">Lint Details</h3>
                <div class="lint-nav">
                    <span id="lint-counter">1 / 5</span>
                    <button class="icon-btn" id="lint-prev" title="Previous" aria-label="Previous">‹</button>
                    <button class="icon-btn" id="lint-next" title="Next" aria-label="Next">›</button>
                    <button class="icon-btn" id="lint-close" title="Close" aria-label="Close">✕</button>
                </div>
            </div>
            <div class="lint-modal-body">
                <div class="lint-detail">
                    <div class="lint-meta">
                        <span class="lint-severity" id="lint-severity"></span>
                        <span class="lint-code" id="lint-code"></span>
                        <span class="lint-location" id="lint-location"></span>
                    </div>
                    <div class="lint-message" id="lint-message"></div>
                    <div class="lint-help" id="lint-help"></div>
                    <div class="lint-source" id="lint-source"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as ironpress from './vendor/ironpress.js';
        window.ironpress = ironpress;
    </script>
    <script type="module" src="main.js?t=20241119m"></script>
</body>
</html>
