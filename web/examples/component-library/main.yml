# Component Library
# A comprehensive reusable component library

# Button variants
btn:
  from: button
  class: "btn btn-{{variant || 'primary'}} btn-{{size || 'md'}} {{disabled ? 'disabled' : ''}} {{block ? 'btn-block' : ''}}"
  disabled: "{{disabled || false}}"
  children: "{{label}}"

# Icon button
iconBtn:
  from: button
  class: "icon-btn {{variant || ''}}"
  children: "{{icon}}"

# Input fields
input:
  from: input
  type: "{{type || 'text'}}"
  placeholder: "{{placeholder || ''}}"
  value: "{{value || ''}}"
  class: "form-input {{invalid ? 'invalid' : ''}}"
  disabled: "{{disabled || false}}"

textarea:
  from: textarea
  placeholder: "{{placeholder || ''}}"
  value: "{{value || ''}}"
  class: "form-textarea"
  rows: "{{rows || 4}}"

select:
  from: select
  class: "form-select"
  children: "{{options}}"

option:
  from: option
  value: "{{value}}"
  children: "{{label}}"

# Form group
formGroup:
  from: div
  class: "form-group"
  children:
    - from: label
      children: "{{label}}"
      for: "{{id}}"
    - from: "{{input}}"
    - from: span
      class: "error-message"
      children: "{{error || ''}}"

# Card components
card:
  from: div
  class: "card"
  children:
    - from: div
      class: "card-header"
      children:
        - from: h3
          children: "{{title}}"
        - from: span
          class: "card-action"
          children: "{{action || ''}}"
    - from: div
      class: "card-body"
      children: "{{content}}"
    - from: div
      class: "card-footer"
      children: "{{footer || ''}}"

cardGrid:
  from: div
  class: "card-grid"
  children: "{{cards}}"

# Alert/notification
alert:
  from: div
  class: "alert alert-{{type || 'info'}} {{dismissible ? 'alert-dismissible' : ''}}"
  children:
    - from: span
      class: "alert-icon"
      children: "{{icon || ''}}"
    - from: span
      class: "alert-message"
      children: "{{message}}"
    - from: button
      class: "alert-close"
      children: "×"

# Badge
badge:
  from: span
  class: "badge badge-{{variant || 'default'}}"
  children: "{{text}}"

# Avatar
avatar:
  from: div
  class: "avatar avatar-{{size || 'md'}}"
  style: "{{image ? 'background-image: url(\${image})' : ''}}"
  children: "{{initials || ''}}"

# Dropdown
dropdown:
  from: div
  class: "dropdown"
  children:
    - from: button
      class: "dropdown-toggle"
      children: "{{trigger}}"
    - from: div
      class: "dropdown-menu"
      children: "{{items}}"

dropdownItem:
  from: a
  class: "dropdown-item"
  href: "{{href || '#'}}"
  children: "{{label}}"

# Modal
modal:
  from: div
  class: "modal-overlay {{open ? 'open' : ''}}"
  children:
    - from: div
      class: "modal-container"
      children:
        - from: div
          class: "modal-header"
          children:
            - from: h3
              children: "{{title}}"
            - from: button
              class: "modal-close"
              children: "×"
        - from: div
          class: "modal-body"
          children: "{{content}}"
        - from: div
          class: "modal-footer"
          children: "{{footer}}"

# Tabs
tabs:
  from: div
  class: "tabs"
  children:
    - from: div
      class: "tab-list"
      role: "tablist"
      children: "{{tabs}}"
    - from: div
      class: "tab-panels"
      children: "{{panels}}"

tab:
  from: button
  class: "tab {{active ? 'active' : ''}}"
  role: "tab"
  children: "{{label}}"

tabPanel:
  from: div
  class: "tab-panel {{active ? 'active' : ''}}"
  role: "tabpanel"
  children: "{{content}}"

# Tooltip
tooltip:
  from: div
  class: "tooltip"
  children:
    - from: span
      class: "tooltip-trigger"
      children: "{{trigger}}"
    - from: div
      class: "tooltip-content"
      children: "{{content}}"

# Table
table:
  from: table
  class: "data-table"
  children:
    - from: thead
      children:
        - from: tr
          children: "{{headers}}"
    - from: tbody
      children: "{{rows}}"

th:
  from: th
  children: "{{label}}"

td:
  from: td
  children: "{{value}}"

tr:
  from: tr
  children: "{{cells}}"

# Main component - Component Showcase
