# Rule 20: from: <main> renders the HTML tag even when a "main" component exists.
main: "from component"

tag_over_component:
  from: <main>
  children: from tag

component_call:
  from: main

_test:
  tag_over_component:
    result: "<main>from tag</main>"
  component_call:
    result: "from component"
