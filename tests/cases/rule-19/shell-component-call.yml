_ymx:
  max_depth: 1
add: ${$0 + $1}
named_sum: ${a * 100 + b}
noop: ready
obj:
  a: 1
recurse: $sh{echo $recurse()}
positional:
  out: $sh{echo $add(12, 34)}
named:
  out: $sh{echo $named_sum(a=1, b=2)}
no_args:
  out: $sh{echo $noop()}
unknown:
  out: $sh{echo $missing()}
non_scalar:
  out: $sh{echo $obj()}
_test:
  positional: {out: {exit_code: 0, stdout: "46\n", stderr: ""}}
  named: {out: {exit_code: 0, stdout: "102\n", stderr: ""}}
  no_args: {out: {exit_code: 0, stdout: "ready\n", stderr: ""}}
  unknown:
    error: E002
  non_scalar:
    error: E011
  recurse:
    error: E008
