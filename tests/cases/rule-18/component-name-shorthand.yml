# a$: x + y — property key ends with $, value is math source, stored under stripped name "a"
comp:
  a$: x + y

# add$: x + y — top-level key ends with $, value is math source, stored as component "add"
# with math_shorthand=true; equivalent to add: ${x + y}
add$:
  x + y

_test:
  comp:
    args:
      x: 3
      y: 5
    result:
      a: 8
  add:
    args:
      x: 3
      y: 5
    result: 8
