# Rule 17: optional property keys with defaults.
# Direct call with no args — the default should be used.
# Direct call with args — the caller's value should win.
comp:
  x?: 2
  y?: 10
  out: $x
_test:
  comp:
    args: {}
    result: {x: 2, y: 10, out: 2}
  comp:
    args: {x: 99}
    result: {x: 99, y: 10, out: 99}
