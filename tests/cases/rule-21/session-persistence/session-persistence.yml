# Rule 21 IPC (rule-21/session-persistence): several calls to the same IPC
# alias reuse the (single) underlying session.
_use:
  echo:
    cmd: [cat]
    transport: pipe
    protocol: line
    request_template: "$0\n"

main:
  call1: $echo{one}
  call2: $echo{two}
  call3: $echo{three}

_test:
  main:
    call1: "one"
    call2: "two"
    call3: "three"
