# tests/cases/rule-21/to-string-number.yml
---
_test:
  to_s_int: {result: "123"}
  to_s_float: {result: "2.5"}
  to_s_null: {result: "null"}
  to_n_int: {result: 42}
  to_n_float: {result: 3.14}
  to_n_bad: {result: null}
  to_n_pass: {result: 123}

to_s_int: $to_string(123)
to_s_float: $to_string(2.5)
to_s_null: $to_string(null)
to_n_int: $to_number("42")
to_n_float: $to_number("3.14")
to_n_bad: $to_number("hello")
to_n_pass: $to_number(123)
