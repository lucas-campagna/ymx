# tests/cases/rule-21/split-basic.yml
---
_test:
  main: ["a","b","c"]
  multi: ["a","b","c"]
  no_match: ["abc"]
  empty_str: {error: E011}
  chars: {error: E011}

main: $split("a,b,c", ",")
multi: $split("a::b::c", "::")
