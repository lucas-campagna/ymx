# tests/cases/rule-21/type-is-*.yml
---
_test:
  t_null: "null"
  t_bool: "bool"
  t_int: "int"
  t_float: "float"
  t_str: "string"
  t_arr: "array"
  t_obj: "object"
  is_arr_yes: true
  is_arr_no: false
  is_obj_yes: true
  is_obj_no: false
  is_str_yes: true
  is_num_yes_int: true
  is_num_yes_float: true
  is_num_no_str: false
  is_null_yes: true
  is_null_no: false

t_null: $type(null)
t_bool: $type(true)
t_int: $type(1)
t_float: $type(1.5)
t_str: $type("hello")
t_arr: $type([1,2])
t_obj: $type({a:1})
is_arr_yes: $is_array([1,2])
is_arr_no: $is_array({a:1})
is_obj_yes: $is_object({a:1})
is_obj_no: $is_object([1,2])
is_str_yes: $is_string("hello")
is_num_yes_int: $is_number(42)
is_num_yes_float: $is_number(3.14)
is_num_no_str: $is_number("42")
is_null_yes: $is_null(null)
is_null_no: $is_null(false)
