# Rule 21 IPC (rule-21/restart-on-failure): restart: on-failure marks a
# session dead after a call failure and respawns on the next call.
# With cat backend and repeated calls, session reuse is exercised.
_use:
  echo:
    cmd: [cat]
    transport: pipe
    protocol: line
    restart: on-failure
    max_restarts: 1
    request_template: "$0\n"

main:
  first: $echo{alpha}
  second: $echo{beta}

_test:
  main:
    first: "alpha"
    second: "beta"
